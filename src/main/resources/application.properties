# MySQL Database Settings (defaults for local, overridden by docker-compose)
spring.datasource.url=jdbc:mysql://localhost:3306/ipmanagerdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Settings
# In production, this should be set via an environment variable (e.g., APP_JWT_SECRET)
app.jwtSecret=${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc3Ryb25nLWFuZC1sb25nLXNlY3JldC1rZXktZm9yLWp3dC1hdXRoZW50aWNhdGlvbg==}
app.jwtExpirationInMs=86400000

# Actuator Settings
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Springdoc OpenAPI (Swagger) Settings
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.packages-to-scan=com.enterprise.ipmanager.controller
springdoc.show-actuator=true
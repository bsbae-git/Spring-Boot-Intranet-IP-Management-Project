<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Jules IPAM - IP 관리 시스템</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1, h2 { color: #333; }
        .container { display: flex; gap: 40px; }
        .section { padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        form { display: flex; flex-direction: column; gap: 10px; }
        input[type="text"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px; background-color: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <h1>Jules IPAM - IP 관리 시스템</h1>

    <div class="container">
        <!-- 네트워크 등록 섹션 -->
        <div class="section">
            <h2>네트워크 등록</h2>
            <form id="network-form">
                <input type="text" id="cidr" placeholder="CIDR (예: 199.168.1.0/24)" required>
                <button type="button" id="register-btn">등록</button>
            </form>
        </div>

        <!-- IP 관리 섹션 -->
        <div class="section">
            <h2>IP 관리</h2>
            <form id="ip-form">
                <input type="text" id="ip-address" placeholder="IP 주소 (예: 199.168.1.10)" required>
                <input type="text" id="user-id" placeholder="사용자 ID">
                <input type="text" id="purpose" placeholder="용도 (할당 시)">
                <div>
                    <button type="button" id="allocate-btn">할당</button>
                    <button type="button" id="release-btn">반납</button>
                </div>
            </form>
        </div>
    </div>

    <!-- IP 목록 테이블 -->
    <h2>IP 목록</h2>

    <!-- 검색 폼 -->
    <form id="search-form" style="margin-bottom: 20px; display: flex; gap: 10px; align-items: center;">
        <input type="text" id="search-ip-address" placeholder="IP 주소">
        <select id="search-status">
            <option value="">-- 상태 선택 --</option>
            <option value="AVAILABLE">AVAILABLE</option>
            <option value="ALLOCATED">ALLOCATED</option>
            <option value="RESERVED">RESERVED</option>
        </select>
        <input type="text" id="search-user-id" placeholder="사용자 ID">
        <button type="button" id="search-btn">검색</button>
    </form>

    <table id="ip-list-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>IP 주소</th>
                <th>상태</th>
                <th>사용자 ID</th>
                <th>네트워크 ID</th>
            </tr>
        </thead>
        <tbody>
            <!-- 데이터는 JavaScript로 채워집니다 -->
        </tbody>
    </table>

    <!-- 페이징 컨트롤 -->
    <div id="pagination-controls" style="margin-top: 20px; text-align: center;">
        <button id="prev-page-btn" disabled>이전 페이지</button>
        <span id="page-info">페이지 1 / 1</span>
        <button id="next-page-btn" disabled>다음 페이지</button>
    </div>

    <script>
        // --- State Management ---
        let currentPage = 0;
        let totalPages = 1;
        let currentSearchParams = {
            ipAddress: '',
            status: '',
            userId: ''
        };

        // --- Event Listeners ---
        document.addEventListener('DOMContentLoaded', () => {
            fetchIpList(); // Initial load

            // Search button
            document.getElementById('search-btn').addEventListener('click', () => {
                currentPage = 0; // Reset to first page on new search
                currentSearchParams.ipAddress = document.getElementById('search-ip-address').value;
                currentSearchParams.status = document.getElementById('search-status').value;
                currentSearchParams.userId = document.getElementById('search-user-id').value;
                fetchIpList();
            });

            // Pagination buttons
            document.getElementById('prev-page-btn').addEventListener('click', () => {
                if (currentPage > 0) {
                    currentPage--;
                    fetchIpList();
                }
            });

            document.getElementById('next-page-btn').addEventListener('click', () => {
                if (currentPage < totalPages - 1) {
                    currentPage++;
                    fetchIpList();
                }
            });

            // Other form listeners
            document.getElementById('register-btn').addEventListener('click', registerNetwork);
            document.getElementById('allocate-btn').addEventListener('click', allocateIp);
            document.getElementById('release-btn').addEventListener('click', releaseIp);
        });

        // --- Core Functions ---

        // IP 목록 조회 함수
        async function fetchIpList() {
            const { ipAddress, status, userId } = currentSearchParams;
            const size = 10;
            let url = `/api/ips?page=${currentPage}&size=${size}`;
            if (ipAddress) url += `&ipAddress=${encodeURIComponent(ipAddress)}`;
            if (status) url += `&status=${encodeURIComponent(status)}`;
            if (userId) url += `&userId=${encodeURIComponent(userId)}`;

            try {
                const response = await fetch(url);
                if (!response.ok) {
                    if (response.status === 401 || response.status === 403 || response.redirected) {
                        alert('인증이 필요합니다. 로그인 페이지로 이동합니다.');
                        window.location.href = '/login';
                        return;
                    }
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const result = await response.json();
                updateIpTable(result.data.ips);
                updatePagination(result.data.currentPage, result.data.totalPages);
            } catch (error) {
                console.error('IP 목록 조회 실패:', error);
                alert('IP 목록을 가져오는 데 실패했습니다.');
            }
        }

        // 테이블 업데이트 함수
        function updateIpTable(ips) {
            const tableBody = document.getElementById('ip-list-table').querySelector('tbody');
            tableBody.innerHTML = ''; // 기존 목록 초기화

            if (ips && ips.length > 0) {
                ips.forEach(ip => {
                    const row = `<tr>
                        <td>${ip.id}</td>
                        <td>${ip.ipAddress}</td>
                        <td>${ip.status}</td>
                        <td>${ip.userId || ''}</td>
                        <td>${ip.networkId}</td>
                    </tr>`;
                    tableBody.innerHTML += row;
                });
            } else {
                const row = `<tr><td colspan="5" style="text-align:center;">데이터가 없습니다.</td></tr>`;
                tableBody.innerHTML = row;
            }
        }

        // 페이징 컨트롤 업데이트 함수
        function updatePagination(page, total) {
            currentPage = page;
            totalPages = total;

            document.getElementById('page-info').textContent = `페이지 ${currentPage + 1} / ${totalPages}`;

            const prevBtn = document.getElementById('prev-page-btn');
            const nextBtn = document.getElementById('next-page-btn');

            prevBtn.disabled = currentPage === 0;
            nextBtn.disabled = currentPage >= totalPages - 1;
        }

        // 네트워크 등록 함수
        async function registerNetwork() {
            const cidrInput = document.getElementById('cidr');
            const cidr = cidrInput.value;
            if (!cidr) {
                alert('CIDR을 입력해주세요.');
                return;
            }

            try {
                const response = await fetch('/api/networks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cidr })
                });

                const result = await response.json();
                if (response.ok && result.statusCode === 200) {
                    alert('네트워크가 성공적으로 등록되었습니다.');
                    cidrInput.value = ''; // 입력창 초기화
                    currentPage = 0; // Reset to first page
                    fetchIpList(); // 목록 새로고침
                } else {
                    throw new Error(result.message || '알 수 없는 오류');
                }
            } catch (error) {
                console.error('네트워크 등록 실패:', error);
                alert(`네트워크 등록에 실패했습니다: ${error.message}`);
            }
        }

        // IP 할당 함수
        async function allocateIp() {
            const ipAddress = document.getElementById('ip-address').value;
            const userId = document.getElementById('user-id').value;
            const purpose = document.getElementById('purpose').value;

            if (!ipAddress || !userId) {
                alert('IP 주소와 사용자 ID를 모두 입력해주세요.');
                return;
            }

            try {
                const response = await fetch('/api/ips/allocate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ipAddress, userId, purpose })
                });

                const result = await response.json();
                if (response.ok && result.statusCode === 200) {
                    alert('IP가 성공적으로 할당되었습니다.');
                    currentPage = 0;
                    fetchIpList(); // 목록 새로고침
                } else {
                    throw new Error(result.message || '알 수 없는 오류');
                }
            } catch (error) {
                console.error('IP 할당 실패:', error);
                alert(`IP 할당에 실패했습니다: ${error.message}`);
            }
        }

        // IP 반납 함수
        async function releaseIp() {
            const ipAddress = document.getElementById('ip-address').value;
            if (!ipAddress) {
                alert('반납할 IP 주소를 입력해주세요.');
                return;
            }

            try {
                const response = await fetch('/api/ips/release', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ipAddress })
                });

                const result = await response.json();
                if (response.ok && result.statusCode === 200) {
                    alert('IP가 성공적으로 반납되었습니다.');
                    currentPage = 0;
                    fetchIpList(); // 목록 새로고침
                } else {
                    throw new Error(result.message || '알 수 없는 오류');
                }
            } catch (error) {
                console.error('IP 반납 실패:', error);
                alert(`IP 반납에 실패했습니다: ${error.message}`);
            }
        }
    </script>

</body>
</html>

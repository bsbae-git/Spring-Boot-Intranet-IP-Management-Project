<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Description</title>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        form { display: flex; flex-direction: column; width: 300px; }
        label { margin-bottom: 5px; }
        input { margin-bottom: 10px; padding: 5px; }
        button { padding: 10px; }
    </style>
</head>
<body>
    <h1>Edit Description for <span th:text="${ipAddress.ipAddress}"></span></h1>
    <form action="/edit" method="post" th:object="${ipAddress}">
        <input type="hidden" th:field="*{id}" />
        <input type="hidden" th:field="*{ipAddress}" />
        <input type="hidden" th:field="*{hostname}" />

        <label for="description">Description:</label>
        <input type="text" id="description" th:field="*{description}">

        <button type="submit">Save Description</button>
    </form>
    <a href="/">Back to IP List</a>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>IP Manager</title>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .actions a { margin-right: 10px; }
    </style>
</head>
<body>
    <h1>IP Address List</h1>

    <div class="actions">
        <a href="/scan">Scan Network</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>IP Address</th>
                <th>Hostname</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="host : ${hosts}">
                <td th:text="${host.id}"></td>
                <td th:text="${host.ipAddress}"></td>
                <td th:text="${host.hostname}"></td>
                <td th:text="${host.description}"></td>
                <td><a th:href="@{/edit/{id}(id=${host.id})}">Edit</a></td>
            </tr>
        </tbody>
    </table>
</body>
</html>

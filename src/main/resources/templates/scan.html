<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Scan Network</title>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        form { display: flex; flex-direction: column; width: 300px; }
        label { margin-bottom: 5px; }
        input { margin-bottom: 10px; padding: 5px; }
        button { padding: 10px; }
    </style>
</head>
<body>
    <h1>Scan Network</h1>
    <form action="/scan" method="post">
        <label for="networkPrefix">Network Prefix (e.g., 192.168.1):</label>
        <input type="text" id="networkPrefix" name="networkPrefix" required>

        <label for="startRange">Start IP Range (e.g., 1):</label>
        <input type="number" id="startRange" name="startRange" min="1" max="254" required>

        <label for="endRange">End IP Range (e.g., 254):</label>
        <input type="number" id="endRange" name="endRange" min="1" max="254" required>

        <button type="submit">Start Scan</button>
    </form>
    <a href="/">Back to IP List</a>
</body>
</html>

# Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Use H2 dialect and let Hibernate create the schema
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable Flyway/Liquibase in tests if you were using them
# spring.flyway.enabled=false
# spring.liquibase.enabled=false

# Defer initialization to ensure schema is created before data.sql is run
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JWT Settings for tests
app.jwtSecret=test-secret-key-for-integration-tests-only
app.jwtExpirationInMs=60000